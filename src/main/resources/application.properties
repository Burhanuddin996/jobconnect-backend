spring.application.name=jobconnect

# ---- Database (deployed values come from environment variables) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/jobconnect}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- Hibernate: auto-creates/updates all tables ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- Server ----
server.port=${PORT:8080}

# ---- JWT ----
jwt.secret=${JWT_SECRET:jobconnect-super-secret-key-change-this-before-deploying-anywhere-1234567890}
jwt.expiration-ms=86400000
# ---- File uploads ----
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB